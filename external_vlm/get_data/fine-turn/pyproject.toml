[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ball-in-cup-vlm-finetune"
version = "0.1.0"
description = "InternVideo2 VLM finetuning scaffold for Ball-in-Cup paired video data."
requires-python = ">=3.10"
dependencies = ["numpy", "PyYAML"]

[project.optional-dependencies]
train = ["torch"]
test = ["pytest", "torch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
