experiment:
  name: smoke
  seed: 0
  output_root: outputs/smoke

resources:
  get_data_root: null
  data_root: outputs/mock_dataset
  output_root: outputs/smoke

model:
  mock: true
  num_frames: 4
  image_size: 32
  embed_dim: 32
  patch_grid: [2, 4, 4]

task:
  text: Catch the ball in the cup.

data:
  batch_size: 2
  num_workers: 0
  train_ratio: 0.70
  validation_ratio: 0.15
  test_ratio: 0.15

loss:
  background_weight: 1.0
  background_map_weight: 0.5
  interaction_weight: 0.25
  interaction_rank_weight: 0.5
  region_weight: 1.0
  dice_weight: 0.5
  temporal_weight: 0.0
  rank_margin: 0.2
  interaction_margin: 0.2

training:
  stage: heads
  epochs: 1
  gradient_accumulation_steps: 1

optimizer:
  head_lr: 1.0e-3
  weight_decay: 0.0

device:
  device: cpu
  amp: false

